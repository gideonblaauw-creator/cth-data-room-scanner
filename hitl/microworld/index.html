<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Understanding Lab — Playground (VertiGreen)</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3a4f;
      --text: #e6edf3;
      --muted: #8b9cb3;
      --accent: #2d6a4f;
      --accent-bright: #3fb950;
      --warn: #d29922;
      --danger: #f85149;
      --unclear: #a371f7;
      --locked: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
    }
    code, pre, .mono { font-family: "SF Mono", "Fira Code", ui-monospace, monospace; }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-start;
      justify-content: space-between;
    }
    header h1 { margin: 0 0 0.25rem; font-size: 1.1rem; font-weight: 600; }
    header p { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .banner {
      background: rgba(210, 153, 34, 0.12);
      border-bottom: 1px solid var(--warn);
      color: var(--warn);
      padding: 0.65rem 1.5rem;
      font-size: 0.85rem;
    }
    .banner.success {
      background: rgba(63, 185, 80, 0.12);
      border-color: var(--accent-bright);
      color: var(--accent-bright);
    }
    .banner.hidden { display: none; }
    .banner .banner-actions { display: inline-flex; gap: 0.5rem; margin-left: 1rem; flex-wrap: wrap; }
    nav.tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      overflow-x: auto;
      padding: 0 0.5rem;
    }
    nav.tabs button {
      font-family: inherit;
      font-size: 0.82rem;
      padding: 0.75rem 1rem;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    nav.tabs button:hover { color: var(--text); }
    nav.tabs button.active {
      color: var(--accent-bright);
      border-bottom-color: var(--accent-bright);
    }
    nav.tabs button.locked-tab { opacity: 0.5; cursor: not-allowed; }
    .tab-panel { display: none; padding: 1.25rem 1.5rem; max-width: 1100px; }
    .tab-panel.active { display: block; }
    .tab-panel h2 { margin: 0 0 0.75rem; font-size: 1.05rem; }
    .tab-panel h3 { margin: 1.25rem 0 0.5rem; font-size: 0.95rem; color: var(--accent-bright); }
    .tab-panel p, .tab-panel li { font-size: 0.9rem; }
    .flow-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
      margin: 1rem 0;
    }
    .flow-step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.8rem;
      text-align: center;
    }
    .flow-step strong { display: block; color: var(--accent-bright); margin-bottom: 0.25rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 1rem 0;
    }
    .label-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; }
    .label-card { padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; }
    .label-card.auto_ok { background: rgba(63,185,80,0.1); border-left: 3px solid var(--accent-bright); }
    .label-card.needs_human { background: rgba(248,81,73,0.1); border-left: 3px solid var(--danger); }
    .label-card.unclear { background: rgba(163,113,247,0.1); border-left: 3px solid var(--unclear); }
    .quiz-question { margin: 1.25rem 0; padding: 1rem; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
    .quiz-question.correct { border-color: var(--accent-bright); }
    .quiz-question.wrong { border-color: var(--danger); }
    .quiz-options label {
      display: block;
      padding: 0.4rem 0;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .tree-layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: 60vh; }
    .tree-sidebar { border-right: 1px solid var(--border); padding: 1rem; overflow-y: auto; }
    .tree-main { padding: 1rem 1.25rem; overflow-y: auto; }
    .finding-item {
      display: block; width: 100%; text-align: left;
      padding: 0.6rem 0.75rem; margin-bottom: 0.35rem;
      border: 1px solid var(--border); border-radius: 6px;
      background: transparent; color: var(--text); cursor: pointer; font-size: 0.78rem;
    }
    .finding-item:hover, .finding-item.active { border-color: var(--accent-bright); background: rgba(63,185,80,0.08); }
    .finding-item.locked { border-left: 3px solid var(--locked); }
    .finding-item.decided { border-left: 3px solid var(--warn); }
    .badge {
      display: inline-block; font-size: 0.62rem; padding: 0.1rem 0.35rem;
      border-radius: 4px; margin-left: 0.25rem; text-transform: uppercase;
    }
    .badge.auto_ok { background: rgba(63,185,80,0.2); color: var(--accent-bright); }
    .badge.needs_human { background: rgba(248,81,73,0.2); color: var(--danger); }
    .badge.unclear { background: rgba(163,113,247,0.2); color: var(--unclear); }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.6rem; margin-bottom: 1rem; }
    .meta-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.8rem; }
    .meta-card label { display: block; font-size: 0.68rem; color: var(--muted); }
    .scrubber, .decision-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .decision-panel.locked-panel { border-color: var(--locked); }
    .step-display { min-height: 3rem; padding: 0.75rem; background: var(--bg); border-radius: 6px; margin: 0.5rem 0; font-size: 0.85rem; }
    .decision-options { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0; }
    .decision-options label {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }
    textarea, input[type="text"], select {
      width: 100%; font-family: inherit; font-size: 0.85rem;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.55rem;
    }
    textarea { min-height: 4rem; resize: vertical; }
    button, .file-btn, .btn-link {
      font-family: inherit; font-size: 0.8rem; padding: 0.45rem 0.85rem;
      border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none;
      display: inline-block;
    }
    button:hover, .file-btn:hover { border-color: var(--accent-bright); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: rgba(45,106,79,0.35); border-color: var(--accent-bright); }
    button.danger { border-color: var(--danger); color: var(--danger); }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.75rem; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin: 0.5rem 0; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent-bright); transition: width 0.25s; }
    input[type="file"] { display: none; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 1rem 0; }
    table.data-table th, table.data-table td { border: 1px solid var(--border); padding: 0.5rem 0.65rem; text-align: left; }
    table.data-table th { background: var(--surface); color: var(--muted); font-weight: 500; }
    .path-map { font-size: 0.82rem; }
    .path-map li { margin: 0.35rem 0; }
    .path-map a { color: var(--accent-bright); }
    .clarification-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.85rem; margin-bottom: 0.65rem; font-size: 0.85rem;
    }
    .lang-toggle button.active { border-color: var(--accent-bright); background: rgba(63,185,80,0.15); }
    footer {
      padding: 0.75rem 1.5rem; border-top: 1px solid var(--border);
      font-size: 0.72rem; color: var(--muted);
    }
    @media (max-width: 800px) {
      .tree-layout { grid-template-columns: 1fr; }
      .tree-sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div id="locksBanner" class="banner hidden"></div>
  <div id="quizBanner" class="banner hidden"></div>
  <header>
    <div>
      <h1 id="titleMain">Understanding Lab — Playground</h1>
      <p id="subtitleMain">Beat 3 · VertiGreen synthetic scenarios · agree / override / defer</p>
    </div>
    <div class="header-actions">
      <div class="lang-toggle">
        <button type="button" id="langEn" class="active">EN</button>
        <button type="button" id="langEs">ES</button>
      </div>
      <span id="runMeta" class="mono" style="font-size:0.75rem;color:var(--muted)"></span>
    </div>
  </header>
  <nav class="tabs" id="tabNav">
    <button type="button" data-tab="context" class="active" id="tabContext">Context</button>
    <button type="button" data-tab="explainer" id="tabExplainer">Explainer</button>
    <button type="button" data-tab="tree" id="tabTree" class="locked-tab">Playground</button>
    <button type="button" data-tab="decisions" id="tabDecisions">Decisions DB</button>
    <button type="button" data-tab="gh" id="tabGh">GH repo</button>
    <button type="button" data-tab="clarifications" id="tabClarifications">Clarifications</button>
  </nav>

  <!-- Context -->
  <section class="tab-panel active" id="panel-context"></section>

  <!-- Explainer -->
  <section class="tab-panel" id="panel-explainer"></section>

  <!-- Decision Tree -->
  <section class="tab-panel" id="panel-tree">
    <div class="tree-layout">
      <aside class="tree-sidebar">
        <div class="controls" style="margin-bottom:0.75rem">
          <label class="file-btn" id="loadFindingsLabel">
            Load findings <input type="file" id="findingsInput" accept=".json" />
          </label>
        </div>
        <div id="progressText" style="font-size:0.75rem;color:var(--muted)"></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div id="findingList"></div>
      </aside>
      <div class="tree-main" id="treeMain">
        <p id="treePlaceholder" style="color:var(--muted)">Loading…</p>
      </div>
    </div>
  </section>

  <!-- Decisions DB -->
  <section class="tab-panel" id="panel-decisions"></section>

  <!-- GH repo -->
  <section class="tab-panel" id="panel-gh"></section>

  <!-- Clarifications -->
  <section class="tab-panel" id="panel-clarifications"></section>

  <footer>
    Geoffrey Litt — <em>Explanations / Micro worlds / Shared spaces</em> · See <code>hitl/NOTION-HITL.md</code>
  </footer>

  <script>
    const STORAGE = {
      decisions: "cth_microworld_decisions",
      quiz: "cth_microworld_quiz",
      clarifications: "cth_microworld_clarifications",
      lang: "cth_microworld_lang",
    };

    const NOTION_DB = "https://app.notion.com/p/bb52cfa45b6744e59983528480fbab4b";
    const REPO_URL = "https://github.com/gideonblaauw-creator/cth-data-room-scanner";
    const DEFAULT_FINDINGS_URL = "defaults/findings-hitl-20260908-214515.json";
    const STABLE_HOST_DOC = "hitl/STABLE-HOST.md";

    function isStaticPublicHost() {
      const h = window.location.hostname;
      if (h === "localhost" || h === "127.0.0.1" || h.endsWith(".local")) return false;
      return true;
    }

    const QUIZ_QUESTIONS = [
      {
        id: "Q1",
        question: { en: "Why does `fake-invoice-redacted.txt` receive `needs_human` instead of `auto_ok`?", es: "¿Por qué `fake-invoice-redacted.txt` recibe `needs_human` en lugar de `auto_ok`?" },
        options: {
          en: ["It contains a partial IBAN that may need redaction confirmation", "It is written in Dutch", "It has no date field", "It references a patent number"],
          es: ["Contiene un IBAN parcial que puede necesitar confirmación de redacción", "Está escrito en holandés", "No tiene campo de fecha", "Hace referencia a un número de patente"],
        },
        answer: 0,
      },
      {
        id: "Q2",
        question: { en: "What label should ambiguous cap-table / SAFE language typically get?", es: "¿Qué etiqueta debe recibir típicamente el lenguaje ambiguo de cap table / SAFE?" },
        options: { en: ["auto_ok", "needs_human", "unclear", "skip"], es: ["auto_ok", "needs_human", "unclear", "skip"] },
        answer: 2,
      },
      {
        id: "Q3",
        question: { en: "Which Geoffrey Litt concept maps to the Decisions database in Notion?", es: "¿Qué concepto de Geoffrey Litt corresponde a la base Decisions en Notion?" },
        options: {
          en: ["Explanations", "Micro worlds", "Shared spaces", "Literate programming"],
          es: ["Explicaciones", "Micromundos", "Espacios compartidos", "Programación literaria"],
        },
        answer: 2,
      },
      {
        id: "Q4",
        question: { en: "When can a run be marked Approved in the HITL gate?", es: "¿Cuándo se puede marcar un run como Aprobado en la puerta HITL?" },
        options: {
          en: ["When the agent finishes scanning", "Only when quiz passed or explicitly waived", "When all files are auto_ok", "Never — always manual"],
          es: ["Cuando el agente termina de escanear", "Solo cuando el cuestionario se pasó o se renunció explícitamente", "Cuando todos los archivos son auto_ok", "Nunca — siempre manual"],
        },
        answer: 1,
      },
      {
        id: "Q5",
        question: { en: "What does the microworld scrubber let a reviewer do?", es: "¿Qué permite hacer el scrubber del micromundo a un revisor?" },
        options: {
          en: ["Edit production scanner code", "Step through synthetic agent reasoning per finding", "Connect to live Notion", "Upload to Google Drive"],
          es: ["Editar código del escáner de producción", "Recorrer el razonamiento sintético del agente por hallazgo", "Conectar a Notion en vivo", "Subir a Google Drive"],
        },
        answer: 1,
      },
    ];

    const MOMENT_LABELS = {
      iban_redaction: { en: "IBAN redaction", es: "Redacción IBAN" },
      unaudited_financials: { en: "Unaudited financials", es: "Finanzas no auditadas" },
      safe_cap_table: { en: "SAFE / cap table", es: "SAFE / tabla de capitalización" },
      hallucinated_metric: { en: "Hallucinated metric", es: "Métrica no respaldada" },
      impact_metrics: { en: "Impact metrics", es: "Métricas de impacto" },
      unsigned_contract: { en: "Unsigned contract", es: "Contrato sin firmar" },
      overview_metric: { en: "Overview metric", es: "Métrica del resumen" },
      general: { en: "General review", es: "Revisión general" },
    };

    const I18N = {
      en: {
        title: "Understanding Lab — Playground",
        subtitle: "Beat 3 · VertiGreen synthetic scenarios · agree / override / defer",
        tabs: { context: "Context", explainer: "Explainer", tree: "Playground", decisions: "Decisions DB", gh: "GH repo", clarifications: "Clarifications" },
        locksReady: "Locks ready — not yet in Notion",
        locksReadyHint: "Download or copy JSON, then push via Infra/Hands (token stays in env, not browser).",
        copyJson: "Copy JSON",
        downloadLocks: "Download microworld-locks.json",
        openDecisionsDb: "Open Decisions DB",
        quizBanner: "Complete the Explainer quiz to unlock the Playground tab (Beat 3).",
        quizPassed: "Quiz passed — Playground unlocked.",
        loadFindings: "Load findings",
        progress: (l, t) => `${l} / ${t} locked`,
        treeLocked: "Pass the Explainer quiz first (Explainer tab) to open Playground.",
        placeholder: "Select a finding to review agent reasoning and lock your decision.",
        agree: "Agree with agent", override: "Override", defer: "Defer",
        rationale: "Rationale (required, min 8 chars)",
        saveDraft: "Save draft", lockDecision: "Lock decision",
        lockConfirm: "Lock this decision? It becomes immutable until you explicitly unlock.",
        unlock: "Unlock", unlockConfirm: "Unlock this decision? You will need to re-lock with a new rationale.",
        locked: "Locked", decided: "Draft saved", unlocked: "Unreviewed",
        allLockedTitle: "All decisions locked",
        rationaleShort: "Rationale must be at least 8 characters.",
        pickDecision: "Choose agree, override, or defer before locking.",
        moment: "Review moment", file: "File", pillar: "Pillar", rule: "Rule fired",
        label: "Label", suggestion: "Agent suggestion", scrubber: "Reasoning scrubber",
        matched: "Matched", step: (i, n) => `Step ${i} / ${n}`, decision: "Your decision",
        localLocks: "Local locks (not yet pushed)",
        noLocalLocks: "No locked decisions yet. Complete the Playground tab first.",
        pushRecipe: "Push recipe (Infisical / env token only)",
        pushCmd: "python scripts/push_microworld_to_notion.py",
        dryRunCmd: "python scripts/push_microworld_to_notion.py --dry-run",
        pastePack: "Copy Notion paste pack",
        addClarification: "Add clarification",
        exportClarifications: "Export clarifications.json",
        noClarifications: "No open clarifications yet. Add notes for deferrals or needs-clarification items.",
        findingId: "Finding ID", note: "Note", created: "Created",
      },
      es: {
        title: "Understanding Lab — Playground",
        subtitle: "Beat 3 · escenarios sintéticos VertiGreen · acordar / anular / aplazar",
        tabs: { context: "Contexto", explainer: "Explicador", tree: "Playground", decisions: "Base Decisions", gh: "Repo GH", clarifications: "Aclaraciones" },
        locksReady: "Bloqueos listos — aún no en Notion",
        locksReadyHint: "Descargue o copie el JSON, luego envíe vía Infra/Hands (token en env, no en navegador).",
        copyJson: "Copiar JSON",
        downloadLocks: "Descargar microworld-locks.json",
        openDecisionsDb: "Abrir base Decisions",
        quizBanner: "Complete el cuestionario del Explicador para desbloquear el Árbol de decisiones.",
        quizPassed: "Cuestionario aprobado — Árbol de decisiones desbloqueado.",
        loadFindings: "Cargar hallazgos",
        progress: (l, t) => `${l} / ${t} bloqueadas`,
        treeLocked: "Primero apruebe el cuestionario del Explicador (pestaña Explicador).",
        placeholder: "Seleccione un hallazgo para revisar el razonamiento y bloquear su decisión.",
        agree: "De acuerdo", override: "Anular", defer: "Aplazar",
        rationale: "Justificación (mín. 8 caracteres)",
        saveDraft: "Guardar borrador", lockDecision: "Bloquear decisión",
        lockConfirm: "¿Bloquear? Será inmutable hasta desbloquear explícitamente.",
        unlock: "Desbloquear", unlockConfirm: "¿Desbloquear? Deberá volver a bloquear con nueva justificación.",
        locked: "Bloqueada", decided: "Borrador", unlocked: "Sin revisar",
        allLockedTitle: "Todas las decisiones bloqueadas",
        rationaleShort: "La justificación debe tener al menos 8 caracteres.",
        pickDecision: "Elija de acuerdo, anular o aplazar.",
        moment: "Momento", file: "Archivo", pillar: "Pilar", rule: "Regla",
        label: "Etiqueta", suggestion: "Sugerencia", scrubber: "Scrubber",
        matched: "Coincidencia", step: (i, n) => `Paso ${i} / ${n}`, decision: "Su decisión",
        localLocks: "Bloqueos locales (aún no enviados)",
        noLocalLocks: "Sin bloqueos aún. Complete el Árbol de decisiones primero.",
        pushRecipe: "Receta de envío (token solo en env / Infisical)",
        pushCmd: "python scripts/push_microworld_to_notion.py",
        dryRunCmd: "python scripts/push_microworld_to_notion.py --dry-run",
        pastePack: "Copiar paquete Notion",
        addClarification: "Añadir aclaración",
        exportClarifications: "Exportar clarifications.json",
        noClarifications: "Sin aclaraciones abiertas.",
        findingId: "ID hallazgo", note: "Nota", created: "Creado",
      },
    };

    let lang = localStorage.getItem(STORAGE.lang) || "en";
    let activeTab = "context";
    let findingsDoc = null;
    let quizState = loadQuizState();
    let selectedId = null;
    let stepIndex = 0;
    let decisions = loadDecisions();
    let clarifications = loadClarifications();

    const t = (key, ...args) => {
      const v = I18N[lang][key];
      return typeof v === "function" ? v(...args) : v;
    };
    const el = (id) => document.getElementById(id);

    function loadDecisions() {
      try {
        const raw = localStorage.getItem(STORAGE.decisions);
        return raw ? new Map(Object.entries(JSON.parse(raw))) : new Map();
      } catch { return new Map(); }
    }
    function saveDecisions() {
      localStorage.setItem(STORAGE.decisions, JSON.stringify(Object.fromEntries(decisions)));
    }
    function loadQuizState() {
      try {
        const raw = localStorage.getItem(STORAGE.quiz);
        if (raw) return JSON.parse(raw);
      } catch { /* */ }
      return { answers: {}, passed: false, submitted: false };
    }
    function saveQuizState() {
      localStorage.setItem(STORAGE.quiz, JSON.stringify(quizState));
    }
    function loadClarifications() {
      try {
        const raw = localStorage.getItem(STORAGE.clarifications);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    }
    function saveClarifications() {
      localStorage.setItem(STORAGE.clarifications, JSON.stringify(clarifications));
    }

    function quizPassed() {
      return Boolean(quizState.passed);
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${url}`);
      return res.json();
    }

    function normalizeFindings(doc) {
      const findings = doc.gate_findings || doc.findings || [];
      return { run_id: doc.run_id, company: doc.company || "VertiGreen Robotics", scanned_at: doc.scanned_at, findings };
    }

    async function loadFindings() {
      const params = new URLSearchParams(window.location.search);
      const findingsParam = params.get("findings");
      const localDevPaths = ["../../out/findings.json", "../out/findings.json", "out/findings.json"];
      const paths = findingsParam
        ? [findingsParam]
        : isStaticPublicHost()
          ? [DEFAULT_FINDINGS_URL]
          : [...localDevPaths, DEFAULT_FINDINGS_URL];
      for (const p of paths) {
        try {
          findingsDoc = normalizeFindings(await fetchJson(p));
          return;
        } catch { /* next */ }
      }
      throw new Error("Could not load findings");
    }

    function decisionState(findingId) {
      const d = decisions.get(findingId);
      if (!d) return "unlocked";
      if (d.locked_at) return "locked";
      if (d.human_decision) return "decided";
      return "unlocked";
    }

    function lockedCount() {
      if (!findingsDoc) return 0;
      return findingsDoc.findings.filter((f) => decisionState(f.finding_id) === "locked").length;
    }

    function allLocked() {
      if (!findingsDoc) return false;
      const total = findingsDoc.findings.length;
      return total > 0 && lockedCount() === total;
    }

    function buildLocksDocument() {
      const locks = findingsDoc.findings
        .map((f) => decisions.get(f.finding_id))
        .filter((d) => d && d.locked_at)
        .map((d) => ({
          finding_id: d.finding_id,
          fixture_path: d.fixture_path,
          agent_suggestion: d.agent_suggestion,
          agent_label: d.agent_label,
          human_decision: d.human_decision,
          rationale: d.rationale,
          status: d.status || "reviewed",
          locked_at: d.locked_at,
          moment: d.moment,
        }));
      return {
        version: 1,
        run_id: findingsDoc.run_id,
        company: findingsDoc.company,
        quiz_passed: quizPassed(),
        quiz_source: "explainer-quiz",
        locked_at: new Date().toISOString(),
        reviewer: null,
        run_link: "hitl/out/microworld-locks.json",
        locks,
      };
    }

    function updateBanners() {
      const quizBanner = el("quizBanner");
      if (!quizPassed()) {
        quizBanner.textContent = t("quizBanner");
        quizBanner.classList.remove("hidden", "success");
      } else {
        quizBanner.textContent = t("quizPassed");
        quizBanner.classList.remove("hidden");
        quizBanner.classList.add("success");
      }

      const locksBanner = el("locksBanner");
      if (allLocked()) {
        locksBanner.className = "banner success";
        locksBanner.innerHTML = `
          <strong>${t("locksReady")}</strong> — ${t("locksReadyHint")}
          <span class="banner-actions">
            <button type="button" class="primary" id="bannerCopyJson">${t("copyJson")}</button>
            <button type="button" id="bannerDownload">${t("downloadLocks")}</button>
            <a href="${NOTION_DB}" target="_blank" rel="noopener"><button type="button">${t("openDecisionsDb")}</button></a>
          </span>`;
        locksBanner.classList.remove("hidden");
        el("bannerCopyJson").onclick = () => navigator.clipboard.writeText(JSON.stringify(buildLocksDocument(), null, 2));
        el("bannerDownload").onclick = downloadLocks;
      } else {
        locksBanner.classList.add("hidden");
      }
    }

    function downloadLocks() {
      const doc = buildLocksDocument();
      const blob = new Blob([JSON.stringify(doc, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "microworld-locks.json";
      a.click();
    }

      el(`panel-${tab}`).classList.add("active");
      document.querySelector(`[data-tab="${tab}"]`).classList.add("active");
      if (tab === "decisions") renderDecisionsPanel();
      if (tab === "clarifications") renderClarificationsPanel();

    function renderExplainerPanel() {
      const questionsHtml = QUIZ_QUESTIONS.map((q, qi) => {
        const opts = q.options[lang].map((opt, oi) => `
          <label>
            <input type="radio" name="quiz_${q.id}" value="${oi}" ${quizState.answers[q.id] === oi ? "checked" : ""} ${quizState.submitted ? "disabled" : ""} />
            (${String.fromCharCode(65 + oi)}) ${opt}
          </label>`).join("");
        let cls = "quiz-question";
        if (quizState.submitted) {
          cls += quizState.answers[q.id] === q.answer ? " correct" : " wrong";
        }
        return `<div class="${cls}" data-q="${q.id}">

      const passed = quizPassed();
      el("panel-explainer").innerHTML = `

          <li><strong>agree</strong> — ${lang === "en" ? "Accept agent label and suggested action." : "Aceptar etiqueta y acción del agente."}</li>
          <li><strong>override</strong> — ${lang === "en" ? "Different label or action (document in Rationale)." : "Etiqueta o acción diferente (documentar en Justificación)."}</li>
          <li><strong>defer</strong> — ${lang === "en" ? "Needs more context or external counsel." : "Necesita más contexto o asesoría externa."}</li>
        </ul>

        <h3>${lang === "en" ? "Quiz (5 questions)" : "Cuestionario (5 preguntas)"}</h3>
        <div id="quizForm">${questionsHtml}</div>

            ? `<span style="color:var(--accent-bright)">✓ ${lang === "en" ? "Quiz passed" : "Cuestionario aprobado"} (${quizState.score}/5)</span>

               <button type="button" class="primary" id="goToTree">${lang === "en" ? "View Understanding Lab (Playground)" : "Ver Playground"}</button>`
            : `<button type="button" class="primary" id="submitQuiz">${lang === "en" ? "Submit quiz" : "Enviar cuestionario"}</button>`}
        </div>`;

      if (!passed) {
        el("submitQuiz").onclick = submitQuiz;
      } else {
        el("retakeQuiz").onclick = () => { quizState = { answers: {}, passed: false, submitted: false }; saveQuizState(); renderExplainerPanel(); updateTreeTabLock(); updateBanners(); };
        el("goToTree").onclick = () => switchTab("tree");
      }

    function submitQuiz() {
      let score = 0;
      QUIZ_QUESTIONS.forEach((q) => {
        const sel = document.querySelector(`input[name="quiz_${q.id}"]:checked`);
        if (sel) quizState.answers[q.id] = parseInt(sel.value, 10);
        if (quizState.answers[q.id] === q.answer) score++;
      });
      const allAnswered = QUIZ_QUESTIONS.every((q) => quizState.answers[q.id] !== undefined);
      if (!allAnswered) {
        alert(lang === "en" ? "Answer all 5 questions." : "Responda las 5 preguntas.");
        return;
      }
      quizState.submitted = true;
      quizState.score = score;
      quizState.passed = score === QUIZ_QUESTIONS.length;
      saveQuizState();
      renderExplainerPanel();
      updateTreeTabLock();
      updateBanners();
      if (quizState.passed) switchTab("tree");
      else alert(lang === "en" ? `Score ${score}/5 — review labels above and retake.` : `Puntuación ${score}/5 — revise y repita.`);
    }

    function updateTreeTabLock() {
      const treeTab = el("tabTree");
      if (quizPassed()) {
        treeTab.classList.remove("locked-tab");
      } else {
        treeTab.classList.add("locked-tab");
      }
    }

    function renderList() {
      const list = el("findingList");
      if (!findingsDoc) return;
      list.innerHTML = findingsDoc.findings.map((f) => {
        const state = decisionState(f.finding_id);
        const moment = f.moment || "general";
        const momentLabel = (MOMENT_LABELS[moment] || MOMENT_LABELS.general)[lang];
        const stateLabel = t(state === "locked" ? "locked" : state === "decided" ? "decided" : "unlocked");
        return `<button class="finding-item ${f.finding_id === selectedId ? "active" : ""} ${state}" data-id="${f.finding_id}">
          ${f.finding_id}<span class="badge ${f.label}">${f.label}</span>
          <div style="color:var(--muted);margin-top:0.2rem;font-size:0.7rem;">${f.fixture_path}</div>
          <span style="font-size:0.62rem;color:var(--muted);display:block;margin-top:0.2rem;">${momentLabel} · ${stateLabel}</span>
        </button>`;
      }).join("");
      list.querySelectorAll(".finding-item").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedId = btn.dataset.id;
          stepIndex = 0;
          renderList();
          renderTreeDetail();
        });
      });
    }

    function updateProgress() {
      if (!findingsDoc) return;
      const total = findingsDoc.findings.length;
      const locked = lockedCount();
      el("progressText").textContent = t("progress", locked, total);
      el("progressFill").style.width = total ? `${(locked / total) * 100}%` : "0%";
      updateBanners();
      if (allLocked() && activeTab === "tree") renderTreeEndScreen();
    }

    function renderTreeDetail() {
      const panel = el("treeMain");
      const f = findingsDoc?.findings.find((x) => x.finding_id === selectedId);
      if (!f) {
        panel.innerHTML = `<p style="color:var(--muted)">${t("placeholder")}</p>`;
        return;
      }
      const steps = f.reasoning_steps || [];
      const step = steps[stepIndex] || { description: "—" };
      const d = decisions.get(f.finding_id) || {};
      const isLocked = decisionState(f.finding_id) === "locked";
      const momentLabel = (MOMENT_LABELS[f.moment || "general"] || MOMENT_LABELS.general)[lang];

      panel.innerHTML = `
        <h2 style="margin:0 0 0.75rem;font-size:1rem;">${f.finding_id} — ${f.fixture_path}</h2>
        <div class="meta-grid">
          <div class="meta-card"><label>${t("moment")}</label><span>${momentLabel}</span></div>
          <div class="meta-card"><label>${t("file")}</label><span>${f.fixture_path}</span></div>
          <div class="meta-card"><label>${t("pillar")}</label><span>${f.pillar || "—"}</span></div>
          <div class="meta-card"><label>${t("rule")}</label><span>${f.rule_fired}</span></div>
          <div class="meta-card"><label>${t("label")}</label><span class="badge ${f.label}">${f.label}</span></div>
          <div class="meta-card"><label>${t("suggestion")}</label><span>${f.agent_suggestion}</span></div>
        </div>
        <p style="font-size:0.82rem;color:var(--muted)">${f.excerpt || ""}</p>
        <div class="scrubber">
          <strong>${t("scrubber")}</strong>
          <div class="step-display">
            <div><strong>${step.rule_id || "—"}</strong> — ${step.description}</div>
            ${step.matched_text ? `<div style="margin-top:0.5rem;color:var(--warn);">${t("matched")}: "${step.matched_text}"</div>` : ""}
          </div>
          <div class="controls">
            <button id="prevBtn" ${stepIndex === 0 ? "disabled" : ""}>←</button>
            <button id="nextBtn" ${stepIndex >= steps.length - 1 ? "disabled" : ""}>→</button>
            <span style="color:var(--muted);font-size:0.78rem;">${t("step", stepIndex + 1, steps.length)}</span>
          </div>
        </div>
        <div class="decision-panel ${isLocked ? "locked-panel" : ""}">
          <strong>${t("decision")}</strong>
          <div class="decision-options">
            ${["agree", "override", "defer"].map((opt) => `
              <label><input type="radio" name="human_decision" value="${opt}" ${d.human_decision === opt ? "checked" : ""} ${isLocked ? "disabled" : ""} /> ${t(opt)}</label>`).join("")}
          </div>
          <label for="rationale">${t("rationale")}</label>
          <textarea id="rationale" ${isLocked ? "disabled" : ""}>${d.rationale || ""}</textarea>
          <div class="controls">
            ${isLocked
              ? `<button type="button" class="danger" id="unlockBtn">${t("unlock")}</button>
                 <span style="color:var(--locked);font-size:0.78rem;">${t("locked")} · ${d.locked_at || ""}</span>`
              : `<button type="button" id="saveDraftBtn">${t("saveDraft")}</button>
                 <button type="button" class="primary" id="lockBtn">${t("lockDecision")}</button>`}
          </div>
        </div>`;

      el("prevBtn").onclick = () => { stepIndex--; renderTreeDetail(); };
      el("nextBtn").onclick = () => { stepIndex++; renderTreeDetail(); };
      if (!isLocked) {
        el("saveDraftBtn").onclick = saveDraft;
        el("lockBtn").onclick = lockDecision;
      } else {
        el("unlockBtn").onclick = unlockDecision;
      }
    }

    function readForm() {
      const decision = document.querySelector('input[name="human_decision"]:checked');
      return {
        finding_id: selectedId,
        human_decision: decision ? decision.value : null,
        rationale: el("rationale").value.trim(),
      };
    }

    function saveDraft() {
      const f = findingsDoc.findings.find((x) => x.finding_id === selectedId);
      const form = readForm();
      decisions.set(selectedId, {
        ...decisions.get(selectedId),
        ...form,
        fixture_path: f.fixture_path,
        agent_suggestion: f.agent_suggestion,
        agent_label: f.label,
        moment: f.moment,
        status: "pending",
      });
      saveDecisions();
      renderList();
      updateProgress();
    }

    function lockDecision() {
      const form = readForm();
      if (!form.human_decision) { alert(t("pickDecision")); return; }
      if (form.rationale.length < 8) { alert(t("rationaleShort")); return; }
      if (!confirm(t("lockConfirm"))) return;
      const f = findingsDoc.findings.find((x) => x.finding_id === selectedId);
      decisions.set(selectedId, {
        ...form,
        fixture_path: f.fixture_path,
        agent_suggestion: f.agent_suggestion,
        agent_label: f.label,
        moment: f.moment,
        status: "reviewed",
        locked_at: new Date().toISOString(),
      });
      saveDecisions();
      renderList();
      const next = findingsDoc.findings.find((x) => decisionState(x.finding_id) !== "locked" && x.finding_id !== selectedId);
      if (next) { selectedId = next.finding_id; stepIndex = 0; }
      renderTreeDetail();
      updateProgress();
    }

    function unlockDecision() {
      if (!confirm(t("unlockConfirm"))) return;
      const d = decisions.get(selectedId);
      if (d) { delete d.locked_at; d.status = "pending"; saveDecisions(); }
      renderList();
      renderTreeDetail();
      updateProgress();
    }

        <ul class="path-map">
          <li><a href="${REPO_URL}/tree/main/fixtures/sample-dataroom" target="_blank" rel="noopener"><code>fixtures/sample-dataroom/</code></a> — ${lang === "en" ? "Synthetic VertiGreen dataroom" : "Dataroom sintético"}</li>
          <li><a href="${REPO_URL}/tree/main/hitl/microworld" target="_blank" rel="noopener"><code>hitl/microworld/</code></a> — ${lang === "en" ? "This tabbed microworld app" : "Esta app de micromundo"}</li>
          <li><a href="${REPO_URL}/blob/main/scripts/push_microworld_to_notion.py" target="_blank" rel="noopener"><code>scripts/push_microworld_to_notion.py</code></a> — ${lang === "en" ? "Push locks to Notion (env token)" : "Enviar bloqueos a Notion"}</li>
          <li><a href="${REPO_URL}/pull/5" target="_blank" rel="noopener">PR #5</a> — ${lang === "en" ? "VertiGreen micro-sim (EN/ES)" : "Micro-sim VertiGreen"}</li>
          <li><a href="${REPO_URL}/pull/6" target="_blank" rel="noopener">PR #6</a> — ${lang === "en" ? "Interactive lock-in (superseded by this PR)" : "Bloqueo interactivo"}</li>
        </ul>
        <h3>${lang === "en" ? "Fixture → finding map (current run)" : "Mapa fixture → hallazgo"}</h3>
        <ul class="path-map">${fixtureMap || `<li style="color:var(--muted)">${lang === "en" ? "Load findings to see map" : "Cargue hallazgos"}</li>`}</ul>`;
    }

    function renderClarificationsPanel() {
      const items = clarifications.length
        ? clarifications.map((c, i) => `
            <div class="clarification-item">
              <strong>${c.finding_id}</strong> · <span style="color:var(--muted)">${c.created_at}</span>
              <p style="margin:0.5rem 0 0">${c.note}</p>
              <button type="button" class="danger" style="margin-top:0.5rem;font-size:0.72rem" data-del="${i}">${lang === "en" ? "Remove" : "Eliminar"}</button>
            </div>`).join("")
        : `<p style="color:var(--muted)">${t("noClarifications")}</p>`;

      const findingOptions = findingsDoc
        ? findingsDoc.findings.map((f) => `<option value="${f.finding_id}">${f.finding_id} — ${f.fixture_path}</option>`).join("")
        : '<option value="F000">F000 — general</option>';

      el("panel-clarifications").innerHTML = `
        <h2>${t("tabs.clarifications")}</h2>
        <p>${lang === "en" ? "Capture open questions, deferrals, and needs-clarification notes tied to a finding." : "Capture notas de aplazamiento y aclaraciones por hallazgo."}</p>
        <div class="card">
          <label>${t("findingId")}</label>
          <select id="clarFinding">${findingOptions}</select>
          <label style="margin-top:0.75rem;display:block">${t("note")}</label>
          <textarea id="clarNote" placeholder="${lang === "en" ? "What needs clarification?" : "¿Qué necesita aclaración?"}"></textarea>
          <div class="controls"><button type="button" class="primary" id="addClar">${t("addClarification")}</button></div>
        </div>
        <div id="clarList">${items}</div>
        <div class="controls">
          <button type="button" id="exportClar">${t("exportClarifications")}</button>
        </div>`;

      el("addClar").onclick = () => {
        const note = el("clarNote").value.trim();
        if (note.length < 4) return;
        clarifications.push({
          finding_id: el("clarFinding").value,
          note,
          created_at: new Date().toISOString(),
        });
        saveClarifications();
        el("clarNote").value = "";
        renderClarificationsPanel();
      };
      document.querySelectorAll("[data-del]").forEach((btn) => {
        btn.onclick = () => {
          clarifications.splice(parseInt(btn.dataset.del, 10), 1);
          saveClarifications();
          renderClarificationsPanel();
        };
      });
      el("exportClar").onclick = () => {
        const blob = new Blob([JSON.stringify({ version: 1, run_id: findingsDoc?.run_id, clarifications }, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "clarifications.json";
        a.click();
      };
    }

    function updateHeader() {
      el("titleMain").textContent = t("title");
      el("subtitleMain").textContent = t("subtitle");
      el("tabContext").textContent = t("tabs.context");
      el("tabExplainer").textContent = t("tabs.explainer");
      el("tabTree").textContent = t("tabs.tree");
      el("tabDecisions").textContent = t("tabs.decisions");
      el("tabGh").textContent = t("tabs.gh");
      el("tabClarifications").textContent = t("tabs.clarifications");
      el("loadFindingsLabel").childNodes[0].textContent = t("loadFindings") + " ";
      el("runMeta").textContent = findingsDoc ? `${findingsDoc.company} · ${findingsDoc.run_id}` : "";
    }

    document.querySelectorAll("nav.tabs button").forEach((btn) => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    el("langEn").onclick = () => { lang = "en"; localStorage.setItem(STORAGE.lang, lang); el("langEn").classList.add("active"); el("langEs").classList.remove("active"); refreshAll(); };
    el("langEs").onclick = () => { lang = "es"; localStorage.setItem(STORAGE.lang, lang); el("langEs").classList.add("active"); el("langEn").classList.remove("active"); refreshAll(); };

    el("findingsInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        findingsDoc = normalizeFindings(JSON.parse(await file.text()));
        selectedId = findingsDoc.findings[0]?.finding_id || null;
        refreshAll();
      } catch (err) { alert(err.message); }
    });

    function refreshAll() {
      updateHeader();
      renderContextPanel();
      renderExplainerPanel();
      renderGhPanel();
      updateTreeTabLock();
      if (findingsDoc) {
        renderList();
        renderTreeDetail();
        updateProgress();
      }
      updateBanners();
      if (activeTab === "decisions") renderDecisionsPanel();
      if (activeTab === "clarifications") renderClarificationsPanel();
    }

    async function init() {
      if (lang === "es") { el("langEs").classList.add("active"); el("langEn").classList.remove("active"); }
      try {
        await loadFindings();
        selectedId = findingsDoc.findings[0]?.finding_id || null;
        refreshAll();
      } catch (err) {
        el("treePlaceholder").textContent = "Failed to load: " + err.message;
        renderContextPanel();
        renderExplainerPanel();
        renderGhPanel();
      }
    }

    init();
  </script>
</body>
</html>
